apiVersion: v1
kind: Service
metadata:
  name: tiny-bin-client
spec:
  type: ClusterIP
  selector:
    app: tiny-bin-client
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: tiny-bin-client-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-bin-client
  template:
    metadata:
      labels:
        app: tiny-bin-client
    spec:
      containers:
      - name: tiny-bin-client 
        image: tiny-bin-tiny-bin-client:latest
        imagePullPolicy: Never 
        ports:
          - containerPort: 80
            name: http