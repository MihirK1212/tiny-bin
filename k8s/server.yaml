apiVersion: v1
kind: Service
metadata:
  name: tiny-bin-server
spec:
  type: ClusterIP
  selector:
    app: tiny-bin-server
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: tiny-bin-server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tiny-bin-server
  template:
    metadata:
      labels:
        app: tiny-bin-server
    spec:
      containers:
      - name: tiny-bin-server 
        image: tiny-bin-tiny-bin-server:latest
        imagePullPolicy: Never 
        ports:
          - containerPort: 8000
            name: http
        envFrom:
        - secretRef:
            name: tiny-bin-secret