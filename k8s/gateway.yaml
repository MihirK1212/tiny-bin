apiVersion: v1
kind: Service
metadata:
  name: tiny-bin-gateway-proxy
spec:
  type: NodePort
  selector:
    app: tiny-bin-gateway-proxy
  ports:
    - port: 80
      targetPort: 80 
      protocol: TCP
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: tiny-bin-gateway-proxy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-bin-gateway-proxy
  template:
    metadata:
      labels:
        app: tiny-bin-gateway-proxy
    spec:
      containers:
      - name: tiny-bin-gateway-proxy 
        image: tiny-bin-tiny-bin-gateway-proxy:latest
        imagePullPolicy: Never 
        ports:
          - containerPort: 80
            name: http