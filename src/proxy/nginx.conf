# the container names must match `docker run --name` on tiny-bin-network:
# i.e tiny-bin-client (for client) and tiny-bin-server (for server)

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://tiny-bin-server:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tiny-bin-client:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
